<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./assets/innoq-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INNOQ Timer</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="app">
    <header>
      <img src="./assets/innoq-logo.svg" alt="INNOQ Logo" />
    </header>

    <innoq-timer offsetInMinutes="15">
      <main>
        <section id="timer-input">
          <form id="timer-input-form">
            <label for="hour-input">Pause bis</label>
            <div>
              <input type="number" id="hour-input" placeholder="HH" min="0" max="23" step="1" required />
              <span>:</span>
              <input type="number" id="minute-input" placeholder="MM" min="0" max="59" step="1" required />
            </div>

            <button id="start-btn" type="submit">
              Start Timer
            </button>
          </form>
        </section>

        <section id="timer-display" class="timer-display hidden">
          <h2>Pause bis <span id="countdown-target-time">17:30</span></h2>
          <div class="timer-border-wrapper">
            <div id="remaining-time">
              00:00
            </div>
          </div>

          <button id="stop-btn">
            Stop
          </button>

          <button id="reset-btn" class="reset hidden">
            Reset Timer
          </button>
        </section>
      </main>
    </innoq-timer>
  </div>

  <script type="module" src="./main.js" crossorigin="anonymous"></script>
</body>

</html>
